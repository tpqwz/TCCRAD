name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler and X11 headers
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev tcc

      - name: Test and build the designer
        run: make test

      - name: Stage the executable
        run: cp build/tccrad tccrad

      - uses: actions/upload-artifact@v4
        with:
          name: tccrad-linux-amd64
          path: tccrad
          if-no-files-found: error

      - name: Attach the executable to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tccrad
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
